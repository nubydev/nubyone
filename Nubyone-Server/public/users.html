<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>𝗡𝘂𝗯𝘆𝗢𝗻𝗲 – Users</title>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        color-scheme: dark;
        --bg: #0c2645;
        --border: rgba(34,211,238,.18);
        --border-sub: rgba(255,255,255,.07);
        --accent: #22d3ee;
        --accent-soft: rgba(34,211,238,.2);
        --text: #eef5ff;
        --text-muted: #93c5e8;
        --text-dim: #3d6085;
        --card-bg: rgba(14,48,98,.58);
        --card-hover: rgba(14,100,200,.28);
        --border-hover: rgba(34,211,238,.6);
      }
      html, body { color: var(--text); min-height: 100vh; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(34,211,238,.5); border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(34,211,238,.75); }
      * { scrollbar-width: thin; scrollbar-color: rgba(34,211,238,.5) transparent; }
      body {
        display: flex; flex-direction: column;
        background:
          radial-gradient(ellipse 80% 60% at 15% 10%, rgba(14,165,233,.42) 0%, transparent 55%),
          radial-gradient(ellipse 70% 55% at 85% 80%, rgba(34,211,238,.35) 0%, transparent 55%),
          #0c2645;
        background-attachment: fixed;
      }

      /* ── App header + nav ───────────────────────────────── */
      .app-header { position: sticky; top: 0; z-index: 50; background: rgba(10,30,62,.90); border-bottom: 1px solid rgba(34,211,238,.18); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); flex-shrink: 0; }
      .header-brand-row { display: flex; align-items: center; justify-content: space-between; padding: .7rem 1.25rem; }
      .header-brand { display: flex; align-items: center; gap: .25rem; text-decoration: none; }
      .header-name { font-size: 1rem; font-weight: 700; color: #f0fffe; letter-spacing: -.01em; }
      .menu-toggle { display: none; align-items: center; gap: .45rem; background: rgba(6,100,180,.15); border: 1px solid rgba(34,211,238,.28); color: #7dd8f0; border-radius: 10px; padding: .45rem .9rem; font-size: .85rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s; }
      .menu-toggle:hover { background: rgba(6,100,180,.25); }
      .nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 49; }
      .nav-overlay.open { display: block; }
      .nav-panel { border-top: 1px solid rgba(255,255,255,.05); padding: .55rem 1.25rem .65rem; display: flex; flex-direction: column; gap: .45rem; }
      .nav-buttons-row { display: flex; flex-wrap: wrap; gap: .42rem; }
      .nav-btn { display: inline-flex; align-items: center; gap: .5rem; padding: .52rem 1rem; border-radius: 10px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); color: #9db1cc; font-size: .855rem; font-weight: 500; text-decoration: none; cursor: pointer; transition: all .15s; white-space: nowrap; font-family: inherit; }
      .nav-btn:hover { background: rgba(6,120,180,.18); border-color: rgba(34,211,238,.35); color: #c0e8ff; transform: translateY(-1px); }
      .nav-btn.active { background: rgba(14,100,200,.3); border-color: rgba(34,211,238,.65); color: #38d6f0; box-shadow: 0 0 0 1px rgba(34,211,238,.18); }
      .nav-btn i { font-size: .82rem; }
      .nav-user-row { display: flex; align-items: center; justify-content: center; gap: .65rem; padding-top: .45rem; border-top: 1px solid rgba(255,255,255,.05); }
      .bell-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: #93c5e8; cursor: pointer; transition: all .15s; font-size: .9rem; }
      .bell-btn:hover { background: rgba(34,211,238,.12); border-color: rgba(34,211,238,.35); color: #22d3ee; }
      .bell-btn.bell-active { background: rgba(34,211,238,.15); border-color: rgba(34,211,238,.6); color: #22d3ee; box-shadow: 0 0 0 2px rgba(34,211,238,.15); }
      .bell-badge { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; border-radius: 99px; background: #ef4444; color: #fff; font-size: .6rem; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 3px; line-height: 1; pointer-events: none; }
      .nav-user-pill { display: flex; align-items: center; gap: .5rem; background: rgba(4,20,50,.6); border: 1px solid rgba(34,211,238,.16); border-radius: 99px; padding: .32rem .85rem .32rem .65rem; }
      .nav-user-pill i { color: #7dd8f0; font-size: .78rem; }
      .nav-username { font-size: .83rem; font-weight: 600; color: #e0f8f8; }
      .nav-role-badge { font-size: .68rem; font-weight: 700; text-transform: capitalize; background: rgba(138,43,226,.22); border: 1px solid rgba(138,43,226,.38); color: #c084fc; border-radius: 99px; padding: .13rem .52rem; }
      .logout-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2); color: #fca5a5; cursor: pointer; transition: all .15s; font-size: .9rem; font-family: inherit; }
      .logout-btn:hover { background: rgba(239,68,68,.2); border-color: rgba(239,68,68,.5); }
      @keyframes logo-bounce { 0%,100%{transform:translateY(3px)} 50%{transform:translateY(-3px)} }
      .logo-bounce { animation: logo-bounce 2.2s ease-in-out infinite; display: inline-flex; align-items: center; }
      .logo-img-sm { width:30px; height:30px; object-fit:contain; border-radius:7px; flex-shrink:0; }

      .btn-ghost { display: inline-flex; align-items: center; gap: .4rem; padding: .65rem .95rem; border-radius: 9px;
        background: rgba(255,255,255,.05); border: 1px solid var(--border); color: #c4c9f8; font-size: .855rem;
        font-weight: 600; font-family: inherit; cursor: pointer; }
      .btn-ghost:hover { background: rgba(255,255,255,.09); }

      .main { flex: 1; padding: 1.75rem 1.5rem; min-width: 0; }

      .page-header { margin-bottom: 1.8rem; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
      .page-title  { font-size: 1.35rem; font-weight: 700; color: #f8fbff; letter-spacing: -.02em; }
      .page-sub    { color: var(--text-muted); font-size: .855rem; margin-top: .22rem; }

      .add-btn { display: inline-flex; align-items: center; gap: .5rem; padding: .72rem 1.1rem; border-radius: 9px;
        background: linear-gradient(135deg,#0891b2,#22d3ee); color: #fff; font-weight: 700; font-size: .855rem;
        font-family: inherit; border: none; cursor: pointer; flex-shrink: 0; white-space: nowrap; }
      .add-btn:hover { opacity: .88; }

      .table-wrap { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
      table { width: 100%; border-collapse: collapse; }
      thead { background: rgba(255,255,255,.025); }
      thead th { padding: .85rem 1.2rem; text-align: left; font-size: .75rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); white-space: nowrap; }
      thead th:last-child { text-align: right; }
      tbody tr { border-top: 1px solid var(--border); transition: background .1s; }
      tbody tr:hover { background: rgba(255,255,255,.018); }
      tbody td { padding: .85rem 1.2rem; font-size: .855rem; color: var(--text-muted); vertical-align: middle; }
      tbody td:first-child { color: var(--text); font-weight: 600; }
      tbody td:last-child { text-align: right; }

      .role-badge { display: inline-block; padding: .18em .72em; border-radius: 99px; font-size: .72rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: .05em; }
      .role-admin    { background: rgba(239,68,68,.15); color: #fca5a5; }
      .role-operator { background: rgba(251,191,36,.12); color: #fcd34d; }
      .role-tech     { background: rgba(99,102,241,.15); color: #a5b4fc; }
      .role-viewer   { background: rgba(148,163,184,.12); color: #94a3b8; }

      .action-btn { background: none; border: 1px solid var(--border); border-radius: 7px; color: var(--text-muted);
        padding: .32rem .65rem; font-size: .78rem; cursor: pointer; font-family: inherit; transition: background .12s, color .12s; }
      .action-btn:hover { background: rgba(255,255,255,.06); color: var(--text); }
      .action-btn.danger:hover { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.3); color: #fca5a5; }

      .empty-row td { text-align: center; padding: 3rem 1.2rem; color: var(--text-dim); font-size: .875rem; }

      /* Modal */
      .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
        z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
      .modal-overlay.open { display: flex; }
      .modal-box { background: rgba(8,10,22,.98); border: 1px solid var(--border); border-radius: 16px;
        width: 100%; max-width: 420px; padding: 1.6rem; box-shadow: 0 24px 60px rgba(0,0,0,.7); }
      .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.4rem; }
      .modal-title { font-size: 1.05rem; font-weight: 700; color: #f8fbff; }
      .modal-close { background: rgba(255,255,255,.07); border: 1px solid var(--border); border-radius: 7px;
        color: var(--text-muted); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
        cursor: pointer; font-size: .85rem; }
      .modal-close:hover { color: var(--text); }

      .fld { margin-bottom: 1rem; }
      .fld:last-child { margin-bottom: 0; }
      .fld label { display: block; font-size: .78rem; color: var(--text-muted); margin-bottom: .38rem; font-weight: 500; }
      .fld input, .fld select { width: 100%; padding: .62rem .88rem; border-radius: 9px; border: 1px solid var(--border);
        background: rgba(255,255,255,.04); color: var(--text); font-size: .855rem; font-family: inherit;
        outline: none; transition: border-color .14s; }
      .fld input:focus, .fld select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.14); }
      .fld select option { background: #0f1120; }
      .fld-hint { font-size: .72rem; color: var(--text-dim); margin-top: .3rem; }

      .modal-err { display: none; padding: .65rem .9rem; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25);
        border-radius: 9px; color: #fca5a5; font-size: .8rem; margin-bottom: .9rem; }
      .modal-err.show { display: block; }

      .modal-actions { display: flex; gap: .6rem; margin-top: 1.3rem; }
      .modal-actions button { flex: 1; padding: .78rem 1rem; border-radius: 9px; font-size: .875rem;
        font-weight: 600; font-family: inherit; cursor: pointer; border: 1px solid var(--border); }
      .btn-cancel { background: rgba(255,255,255,.04); color: var(--text-muted); }
      .btn-cancel:hover { background: rgba(255,255,255,.08); }
      .btn-save { background: linear-gradient(135deg,#0891b2,#22d3ee); color: #fff; border-color: transparent; }
      .btn-save:hover { opacity: .88; }

      .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: .7rem 1.2rem; border-radius: 10px;
        font-size: .855rem; font-weight: 600; color: #fff; z-index: 200; opacity: 0; transform: translateY(8px);
        transition: opacity .2s, transform .2s; pointer-events: none; }
      .toast.show { opacity: 1; transform: translateY(0); }
      .toast.success { background: #16a34a; }
      .toast.error   { background: #dc2626; }

      @media (max-width: 768px) {
        .menu-toggle { display: flex; }
        .nav-panel { display: none; }
        .nav-panel.open { display: flex; flex-direction: column; gap: .45rem; }
        .nav-user-row { flex-wrap: nowrap; }
        .nav-user-pill { justify-self: center; }
        .main { padding: 1.25rem 1rem; }
      }
      @media (max-width: 640px) {
        .col-created, .col-lastlogin, .col-createdby { display: none; }
        .table-wrap { border-radius: 10px; }
        thead th { padding: .55rem .7rem; font-size: .7rem; }
        tbody td { padding: .6rem .7rem; font-size: .82rem; }
        tbody td:last-child { white-space: nowrap; }
        .action-btn { padding: .22rem .42rem; font-size: .74rem; margin-left: 0 !important; white-space: nowrap; }
        .action-btn + .action-btn { margin-left: .18rem !important; }
        .action-btn i { margin-right: .2rem; }
        .action-btn i:only-child { margin-right: 0; }
        .role-badge { padding: .13em .52em; font-size: .68rem; }
      }

      /* ── Desktop single-row header ───────────────────────── */
      @media (min-width: 769px) {
        .app-header { display: flex; flex-direction: row; align-items: center; padding: 0 1.25rem; }
        .header-brand-row { padding: .55rem 0; padding-right: 1rem; flex-shrink: 0; }
        .nav-panel { flex: 1; flex-direction: row; align-items: center; border-top: none; padding: 0; gap: .45rem; }
        .nav-buttons-row { flex: 1; flex-wrap: nowrap; gap: .3rem; }
        .nav-user-row { padding-top: 0; border-top: none; flex-wrap: nowrap; }
      }
    </style>
      <script src="/assets/branding.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-brand-row">
        <a href="/clients" class="header-brand">
          <span class="logo-bounce"><img src="/assets/logo.png" alt="𝗡𝘂𝗯𝘆𝗢𝗻𝗲" class="logo-img-sm" /></span>
          <span class="header-name">𝗡𝘂𝗯𝘆𝗢𝗻𝗲</span>
        </a>
        <button class="menu-toggle" onclick="toggleNav()" aria-label="Menu">
          <i class="fa-solid fa-bars"></i> Menu
        </button>
      </div>
      <div class="nav-panel" id="nav-panel">
        <div class="nav-buttons-row">
          <a href="/clients" class="nav-btn"><i class="fa-solid fa-desktop"></i> Clients</a>
          <a href="/build" class="nav-btn"><i class="fa-solid fa-hammer"></i> Builder</a>
          <a href="/scripts" class="nav-btn"><i class="fa-solid fa-code"></i> Scripts</a>
          <a href="/users" class="nav-btn active"><i class="fa-solid fa-users"></i> Users</a>
          <a href="/settings" class="nav-btn" id="settings-nav-btn" style="display:none"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>
        <div class="nav-user-row">
          <button class="bell-btn" id="bell-btn" onclick="openNotifDrawer()" title="Notifications">
            <i class="fa-solid fa-bell"></i>
            <span class="bell-badge" id="bell-badge" style="display:none"></span>
          </button>
          <div class="nav-user-pill">
            <i class="fa-solid fa-user"></i>
            <span class="nav-username" id="username-display">Loading…</span>
            <span class="nav-role-badge" id="role-display">—</span>
          </div>
          <button class="logout-btn" onclick="logout()" title="Sign out">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>
      </div>
    </header>

      <main class="main">
        <div class="page-header">
          <div>
            <div class="page-title"><i class="fa-solid fa-users" style="color:#818cf8;margin-right:.4rem;font-size:1.1rem;"></i>Users</div>
            <div class="page-sub">Manage technician accounts and roles</div>
          </div>
          <button class="add-btn" id="add-user-btn" onclick="openAddModal()">
            <i class="fa-solid fa-user-plus"></i> Add User
          </button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Role</th>
                <th class="col-created">Created</th>
                <th class="col-lastlogin">Last Login</th>
                <th class="col-createdby">Created By</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-table-body">
              <tr class="empty-row">
                <td colspan="6"><i class="fa-solid fa-spinner fa-spin" style="margin-right:.5rem;"></i>Loading users…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>

    <!-- Add / Edit Modal -->
    <div class="modal-overlay" id="user-modal">
      <div class="modal-box">
        <div class="modal-head">
          <div class="modal-title" id="modal-title">Add User</div>
          <button class="modal-close" id="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="modal-err" id="error-message">
          <i class="fa-solid fa-triangle-exclamation" style="margin-right:.4rem;"></i>
          <span id="error-text"></span>
        </div>

        <form id="user-form" onsubmit="submitForm(event)">
          <div class="fld">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required pattern="[a-zA-Z0-9_-]+" minlength="3" maxlength="32" placeholder="e.g. john_doe" autocomplete="off" />
            <div class="fld-hint">3–32 characters · letters, numbers, hyphens, underscores</div>
          </div>

          <div class="fld" id="password-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6" placeholder="Minimum 6 characters" autocomplete="new-password" />
          </div>

          <div class="fld">
            <label for="role">Role</label>
            <select id="role" name="role" required>
              <option value="viewer">Viewer — read-only access</option>
              <option value="tech" selected>Technician — can view and connect to clients</option>
              <option value="operator">Operator — can control clients</option>
              <option value="admin">Admin — full access</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancel-btn" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn-save"><i class="fa-solid fa-check" style="margin-right:.4rem;"></i>Save</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      let currentUserId = null;
      let mode = "add";


      

      async function init() {
        const r = await fetch("/api/auth/me");
        if (!r.ok) { window.location.href = "/login"; return; }
        const me = await r.json();
        if (me.role !== "admin") { window.location.href = "/clients"; return; }
        document.getElementById("username-display").textContent = me.username;
        document.getElementById("role-display").textContent = "Administrator";
        document.getElementById("settings-nav-btn").style.display = "";
        loadUsers();
      }

      async function loadUsers() {
        const tbody = document.getElementById("users-table-body");
        tbody.innerHTML = `<tr class="empty-row"><td colspan="6"><i class="fa-solid fa-spinner fa-spin" style="margin-right:.5rem;"></i>Loading users…</td></tr>`;
        try {
          const r = await fetch("/api/users");
          if (!r.ok) throw new Error("Failed to load");
          const users = await r.json();
          renderUsers(users);
        } catch {
          tbody.innerHTML = `<tr class="empty-row"><td colspan="6" style="color:#fca5a5;"><i class="fa-solid fa-triangle-exclamation" style="margin-right:.5rem;"></i>Failed to load users</td></tr>`;
        }
      }

      function renderUsers(users) {
        const tbody = document.getElementById("users-table-body");
        if (!users || users.length === 0) {
          tbody.innerHTML = `<tr class="empty-row"><td colspan="6">No users found</td></tr>`;
          return;
        }
        tbody.innerHTML = users.map(u => `
          <tr>
            <td><i class="fa-solid fa-user" style="color:#4a5580;margin-right:.5rem;font-size:.8rem;"></i>${esc(u.username)}</td>
            <td><span class="role-badge role-${u.role}">${esc(u.role)}</span></td>
            <td class="col-created">${fmtDate(u.created_at)}</td>
            <td class="col-lastlogin">${u.last_login ? fmtDate(u.last_login) : '<span style="color:var(--text-dim)">Never</span>'}</td>
            <td class="col-createdby">${u.created_by ? esc(u.created_by) : '<span style="color:var(--text-dim)">—</span>'}</td>
            <td>
              <button class="action-btn" onclick="openEditRole(${u.id}, '${esc(u.username)}', '${u.role}')"><i class="fa-solid fa-pen" style="margin-right:.3rem;"></i>Edit</button>
              <button class="action-btn" style="margin-left:.35rem;" onclick="openResetPw(${u.id}, '${esc(u.username)}')"><i class="fa-solid fa-key" style="margin-right:.3rem;"></i>Reset PW</button>
              <button class="action-btn danger" style="margin-left:.35rem;" onclick="deleteUser(${u.id}, '${esc(u.username)}')"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>`).join("");
      }

      function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
      function fmtDate(d) { if (!d) return "—"; try { return new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); } catch { return d; } }

      function openAddModal() {
        mode = "add"; currentUserId = null;
        document.getElementById("modal-title").textContent = "Add User";
        document.getElementById("user-form").reset();
        document.getElementById("password-field").style.display = "";
        document.getElementById("password").required = true;
        hideError();
        openModal();
      }

      function openEditRole(id, username, role) {
        mode = "role"; currentUserId = id;
        document.getElementById("modal-title").textContent = `Edit Role — ${username}`;
        document.getElementById("username").value = username;
        document.getElementById("username").readOnly = true;
        document.getElementById("password-field").style.display = "none";
        document.getElementById("password").required = false;
        document.getElementById("role").value = role;
        hideError();
        openModal();
      }

      function openResetPw(id, username) {
        mode = "password"; currentUserId = id;
        document.getElementById("modal-title").textContent = `Reset Password — ${username}`;
        document.getElementById("username").value = username;
        document.getElementById("username").readOnly = true;
        document.getElementById("password-field").style.display = "";
        document.getElementById("password").value = "";
        document.getElementById("password").required = true;
        document.getElementById("role").parentElement.style.display = "none";
        hideError();
        openModal();
      }

      function openModal() {
        document.getElementById("user-modal").classList.add("open");
        setTimeout(() => {
          const firstInput = document.querySelector("#user-form input:not([readonly]):not([type=hidden])");
          if (firstInput) firstInput.focus();
        }, 80);
      }

      function closeModal() {
        document.getElementById("user-modal").classList.remove("open");
        document.getElementById("username").readOnly = false;
        document.querySelector(".fld:has(#role)").style.display = "";
        document.getElementById("user-form").reset();
      }

      function hideError() { document.getElementById("error-message").classList.remove("show"); }
      function showError(msg) {
        const el = document.getElementById("error-message");
        document.getElementById("error-text").textContent = msg;
        el.classList.add("show");
      }

      async function submitForm(e) {
        e.preventDefault();
        hideError();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const role = document.getElementById("role").value;

        try {
          let r;
          if (mode === "add") {
            r = await fetch("/api/users", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({username, password, role}) });
          } else if (mode === "role") {
            r = await fetch(`/api/users/${currentUserId}/role`, { method: "PATCH", headers: {"Content-Type":"application/json"}, body: JSON.stringify({role}) });
          } else {
            r = await fetch(`/api/users/${currentUserId}/password`, { method: "PATCH", headers: {"Content-Type":"application/json"}, body: JSON.stringify({password}) });
          }
          const data = await r.json();
          if (!r.ok) { showError(data.error || "Request failed"); return; }
          closeModal();
          showToast(mode === "add" ? "User created" : "Saved", "success");
          loadUsers();
        } catch {
          showError("Network error — please try again");
        }
      }

      async function deleteUser(id, username) {
        if (!confirm(`Delete user "${username}"? This cannot be undone.`)) return;
        try {
          const r = await fetch(`/api/users/${id}`, { method: "DELETE" });
          if (!r.ok) { const d = await r.json(); showToast(d.error || "Delete failed", "error"); return; }
          showToast("User deleted", "success");
          loadUsers();
        } catch { showToast("Network error", "error"); }
      }

      function showToast(msg, type = "success") {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.className = `toast ${type} show`;
        setTimeout(() => t.classList.remove("show"), 3000);
      }

      let _bellUnread = 0;
      function applyBellState(active) {
        const btn = document.getElementById("bell-btn");
        if (!btn) return;
        if (active) { btn.classList.add("bell-active"); btn.title = "Notifications on — click to mute"; }
        else { btn.classList.remove("bell-active"); btn.title = "Notifications off — click to enable"; }
      }
      function toggleBell() {
        const active = localStorage.getItem("nubyone_notifications_enabled") !== "false";
        const next = !active;
        localStorage.setItem("nubyone_notifications_enabled", next ? "true" : "false");
        applyBellState(next);
      }
      function updateBadge(n) {
        _bellUnread = n;
        const badge = document.getElementById("bell-badge");
        if (badge) { badge.textContent = n > 99 ? "99+" : String(n); badge.style.display = n > 0 ? "" : "none"; }
      }
      async function loadBellCount() {
        try {
          const data = await fetch("/api/notifications?limit=50").then(r => r.json());
          updateBadge(Array.isArray(data) ? data.filter(n => !n.read).length : 0);
        } catch {}
      }
      function showAgentToast(event, host) {
        if (!document.getElementById("_agentToastCss")) {
          const s = document.createElement("style"); s.id = "_agentToastCss";
          s.textContent = "@keyframes _agIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}";
          document.head.appendChild(s);
        }
        let wrap = document.getElementById("_agentToastWrap");
        if (!wrap) {
          wrap = document.createElement("div"); wrap.id = "_agentToastWrap";
          wrap.style.cssText = "position:fixed;bottom:1.2rem;right:1.2rem;z-index:10000;display:flex;flex-direction:column;gap:.35rem;align-items:flex-end;pointer-events:none;";
          document.body.appendChild(wrap);
        }
        const online = event === "connect";
        const h = (host||"agent").length > 22 ? (host||"agent").slice(0,20)+"…" : (host||"agent");
        const el = document.createElement("div");
        el.style.cssText = "display:inline-flex;align-items:center;gap:.4rem;padding:.28rem .65rem;border-radius:99px;font-size:.71rem;font-weight:600;font-family:inherit;background:#0a1628;border:1px solid " + (online ? "rgba(34,197,94,.45)" : "rgba(100,116,139,.3)") + ";color:" + (online ? "#4ade80" : "#94a3b8") + ";box-shadow:0 4px 20px rgba(0,0,0,.5);animation:_agIn .18s ease;white-space:nowrap;";
        el.innerHTML = '<i class="fa-solid ' + (online ? "fa-circle-dot" : "fa-circle-xmark") + '" style="font-size:.6rem;"></i>' + (online ? "Online" : "Offline") + ": <b style='font-weight:700'>" + h + "</b>";
        wrap.appendChild(el);
        setTimeout(() => { el.style.transition = "opacity .2s,transform .2s"; el.style.opacity = "0"; el.style.transform = "translateX(8px)"; setTimeout(() => el.remove(), 220); }, 2500);
      }
      function initNotifWs() {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const ws = new WebSocket(`${proto}//${location.host}/api/notifications/ws`);
        ws.onmessage = (e) => { try { const msg = JSON.parse(e.data); if (msg.type === "client_event") { updateBadge(_bellUnread + 1); showAgentToast(msg.event, msg.host); } } catch {} };
        ws.onclose = () => setTimeout(initNotifWs, 3000);
      }

      async function logout() {
        await fetch("/api/auth/logout", { method: "POST" });
        window.location.href = "/login";
      }

      function toggleNav() {
        const panel = document.getElementById("nav-panel");
        panel.classList.toggle("open");
        if (panel.classList.contains("open")) {
          window.addEventListener("scroll", () => panel.classList.remove("open"), { once: true, passive: true });
        }
      }
      function closeNav() {
        document.getElementById("nav-panel").classList.remove("open");
      }

      init();
      applyBellState(localStorage.getItem("nubyone_notifications_enabled") !== "false");
      loadBellCount();
      initNotifWs();
    </script>
    <script src="/assets/notif-drawer.js"></script>
  </body>
</html>
